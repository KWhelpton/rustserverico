<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Server Rules</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #121110;
    --panel: #1c1a18;
    --panel-2: #24211e;
    --line: #34302b;
    --text: #e8e2da;
    --muted: #a39a8f;
    --accent: #cd412b;
    --accent-2: #e8793a;
    --good: #6fae5a;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 80px; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.6 Inter, system-ui, sans-serif;
  }
  a { color: var(--accent-2); }
  .wrap { max-width: 900px; margin: 0 auto; padding: 0 16px; }

  header {
    background:
      linear-gradient(180deg, rgba(205,65,43,.18), transparent 70%),
      repeating-linear-gradient(135deg, #171513 0 14px, #141211 14px 28px);
    border-bottom: 3px solid var(--accent);
    padding: 56px 0 40px;
    text-align: center;
  }
  h1, h2 { font-family: Oswald, Impact, sans-serif; letter-spacing: .04em; text-transform: uppercase; margin: 0; }
  h1 { font-size: clamp(32px, 7vw, 56px); line-height: 1.05; }
  .tagline { color: var(--accent-2); font-weight: 600; margin: 12px 0 0; font-size: 18px; }
  .meta { color: var(--muted); font-size: 14px; margin-top: 18px; }
  .btn {
    display: inline-block; margin-top: 22px; padding: 11px 22px;
    background: var(--accent); color: #fff; text-decoration: none;
    font-family: Oswald, sans-serif; letter-spacing: .06em; text-transform: uppercase;
    border-radius: 4px;
  }
  .btn:hover { background: #e04a32; }

  nav {
    position: sticky; top: 0; z-index: 5;
    background: rgba(18,17,16,.94); backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
  }
  nav .wrap { display: flex; gap: 8px; overflow-x: auto; padding-top: 10px; padding-bottom: 10px; scrollbar-width: none; }
  nav a {
    flex: none; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px;
    color: var(--muted); text-decoration: none; font-size: 14px; white-space: nowrap;
  }
  nav a:hover { color: var(--text); border-color: var(--accent); }

  .summary {
    margin: 32px 0; padding: 20px 24px;
    background: var(--panel); border-left: 4px solid var(--accent-2); border-radius: 4px;
  }
  .summary h2 { font-size: 20px; color: var(--accent-2); margin-bottom: 8px; }
  .summary ul { margin: 0; padding-left: 20px; }
  .summary li { margin: 4px 0; }

  section.rules {
    margin: 0 0 24px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; overflow: hidden;
  }
  section.rules h2 {
    font-size: 22px; padding: 14px 20px; background: var(--panel-2); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px;
  }
  section.rules h2 .num {
    display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 4px;
    background: var(--accent); color: #fff; font-size: 16px;
  }
  ol { margin: 0; padding: 12px 20px 16px 48px; }
  ol li { margin: 8px 0; padding-left: 4px; }
  ol li::marker { color: var(--accent-2); font-weight: 600; }
  strong { color: #fff; }

  .status { text-align: center; color: var(--muted); padding: 60px 0; }
  footer { color: var(--muted); font-size: 14px; text-align: center; padding: 32px 0 48px; border-top: 1px solid var(--line); margin-top: 32px; }
</style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1 id="name">Server Rules</h1>
      <p class="tagline" id="tagline"></p>
      <div class="meta" id="meta"></div>
      <a class="btn" id="discord" href="#" hidden>Join the Discord</a>
    </div>
  </header>

  <nav><div class="wrap" id="nav"></div></nav>

  <main class="wrap">
    <div class="status" id="status">Loading rules...</div>
    <div id="content" hidden></div>
  </main>

  <footer class="wrap">
    Type <strong>/rules</strong> in game to see these any time. Playing on the server means you agree to them.
  </footer>

<script>
  // Everything comes from rules.json in this repo - edit that file, not this one.
  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function fmt(s) {
    return esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  }
  function isLink(s) { return /^https?:\/\//i.test(s || ''); }

  fetch('rules.json', { cache: 'no-store' })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(d => {
      document.title = (d.serverName || 'Server') + ' - Rules';
      document.getElementById('name').textContent = d.serverName || 'Server Rules';
      document.getElementById('tagline').textContent = d.tagline || '';

      const meta = [];
      if (d.updated) meta.push('Last updated ' + esc(d.updated));
      if (d.wipeSchedule) meta.push('Wipes: ' + fmt(d.wipeSchedule));
      document.getElementById('meta').innerHTML = meta.join(' &middot; ');

      if (isLink(d.discord)) {
        const a = document.getElementById('discord');
        a.href = d.discord; a.hidden = false;
      }

      let html = '';
      if (Array.isArray(d.summary) && d.summary.length) {
        html += '<div class="summary"><h2>The short version</h2><ul>' +
          d.summary.map(s => '<li>' + fmt(s) + '</li>').join('') + '</ul></div>';
      }

      const nav = [];
      (d.sections || []).forEach((sec, i) => {
        const id = esc(sec.id || ('s' + i));
        nav.push('<a href="#' + id + '">' + esc(sec.title) + '</a>');
        html += '<section class="rules" id="' + id + '"><h2><span class="num">' + (i + 1) + '</span>' + esc(sec.title) + '</h2><ol>' +
          (sec.rules || []).map(r => '<li>' + fmt(r) + '</li>').join('') + '</ol></section>';
      });

      document.getElementById('nav').innerHTML = nav.join('');
      const content = document.getElementById('content');
      content.innerHTML = html; content.hidden = false;
      document.getElementById('status').hidden = true;
    })
    .catch(err => {
      document.getElementById('status').textContent = 'Could not load the rules (' + err.message + '). Try refreshing.';
    });
</script>
</body>
</html>
